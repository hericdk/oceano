<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kara · caminhos do avatar</title>
<style>
@font-face { font-family: 'Pixelify'; src: url(../../vendor/fonts/pixelify-sans-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Silkscreen'; src: url(../../vendor/fonts/silkscreen-latin-400-normal.woff2) format('woff2'); }
:root { --fundo: #0b1430; --painel: #12204a; --texto: #e8eefc; --acento: #4da3ff; --sol: #ffd34d; --borda: #2a3b74; }
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; background: var(--fundo); color: var(--texto); font: 15px/1.4 'Pixelify', system-ui, sans-serif; -webkit-font-smoothing: none; }
h1 { font: 400 18px 'Silkscreen', monospace; margin: 0 0 4px; }
p.nota { margin: 0 0 16px; opacity: .85; max-width: 900px; }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.card { background: var(--painel); border: 1px solid var(--borda); padding: 10px; }
.card h2 { font: 400 12px 'Silkscreen', monospace; margin: 0 0 6px; color: var(--sol); }
.card canvas.vista { display: block; width: 100%; aspect-ratio: 1; image-rendering: pixelated; background: #1a2a5a; }
.card dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0 0; font-size: 13px; }
.card dt { opacity: .7; } .card dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.card small { display: block; margin-top: 6px; opacity: .75; font-size: 12px; }
.barra { display: flex; gap: 8px; align-items: center; margin: 0 0 14px; flex-wrap: wrap; }
button { font: 14px 'Pixelify', sans-serif; background: var(--fundo); color: var(--texto); border: 1px solid var(--borda); padding: 5px 10px; cursor: pointer; }
button:hover, button:focus-visible { border-color: var(--acento); outline: 0; }
.oculta { position: fixed; left: -9999px; top: 0; }
</style>
</head>
<body>
<h1>CARA · CAMINHOS DO AVATAR</h1>
<p class="nota">O mesmo roteiro de movimento (virar a cabeça, piscar, falar) em cada caminho. "ms" é o tempo de CPU para
  calcular e desenhar um quadro (média dos últimos 60); "triângulos" é o que vai para a placa de vídeo por quadro.</p>
<div class="barra"><button id="pausar">pausar</button><span id="geral"></span></div>
<div class="grade" id="grade"></div>
<script type="module" src="caminhos.js"></script>
</body>
</html>
