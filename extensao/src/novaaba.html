<!doctype html>
<html lang="pt-BR" data-modo="lite">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova guia</title>
  <link rel="icon" href="icones/32.png">
  <link rel="stylesheet" href="css/oceano.css">
  <link rel="stylesheet" href="css/lite.css">
  <script src="vendor/wasmoon.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <canvas id="mar" aria-hidden="true"></canvas>

  <div id="app">
    <header class="cromo">
      <div class="ferramentas">
        <a href="#" class="lite-marca" data-ir="oceano://nova-aba" aria-label="Oceano, nova aba">
          <span id="lite-logo"></span><span>oceano</span><span class="selo">lite</span>
        </a>
        <nav class="lite-nav" aria-label="Páginas do Oceano">
          <a href="#" data-ir="oceano://mods">Mods</a>
          <a href="#" data-ir="oceano://temas">Temas</a>
          <a href="#" data-ir="oceano://offline">Surfista</a>
          <a href="#" data-ir="oceano://sobre">Sobre</a>
        </nav>
        <span class="lite-espaco"></span>
        <button id="btn-lateral" class="ico" aria-label="Barra lateral" title="Barra lateral"></button>
        <button id="btn-som" class="ico" aria-label="Sons" title="Sons"></button>
        <button id="btn-menu" class="ico" aria-label="Temas" title="Temas"></button>
      </div>
      <div class="slot slot-barra" data-slot="barra"></div>
    </header>

    <div class="corpo">
      <aside id="lateral" class="lateral" aria-label="Barra lateral">
        <div class="lateral-topo">
          <span class="rotulo">Widgets</span>
          <button id="fechar-lateral" class="ico" aria-label="Fechar barra lateral"></button>
        </div>
        <div class="slot slot-lateral" data-slot="lateral"></div>
        <p class="lateral-vazia">Nenhum widget ligado.</p>
        <a href="#" class="lateral-rodape" data-ir="oceano://mods">Widgets são mods em Lua · gerenciar</a>
      </aside>
      <main id="pagina" class="pagina"></main>
    </div>
  </div>

  <div id="avisos" class="avisos" aria-live="polite"></div>

</body>
</html>
